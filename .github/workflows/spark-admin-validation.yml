name: Spark admin tool validation

on:
  push:
    branches:
      - "jarvis/**"
  pull_request:
    branches:
      - "rebuild/jarvis-unified-agent"

jobs:
  validate-spark-admin-tool:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/firebase-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check utility syntax
        run: npm run check
