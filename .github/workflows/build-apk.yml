name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "rebuild/**", "jarvis/**"]
  # Nightly regression build at 03:00 India Standard Time (21:30 UTC); APKs are retained for 14 days.
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: read

concurrency:
  group: jarvis-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Keep the CI debug signing certificate stable so Firebase Google sign-in
      # continues to recognise APKs built by later workflow runs.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1
      - name: Configure Firebase Android app (optional)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
            python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("app/google-services.json").read_text())
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if "com.example.pocketagent" not in packages:
              raise SystemExit("Firebase config package mismatch: expected com.example.pocketagent")
          PY
            echo "Firebase configuration validated for the app package."
          else
            echo "Firebase config secret not set; building the offline-capable app."
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Bundle Gemma model into the APK
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "Missing repository secret HF_TOKEN. Add a Hugging Face read token after accepting the Gemma model terms." >&2
            exit 1
          fi
          mkdir -p app/src/main/assets
          MODEL=app/src/main/assets/gemma3-1b-it-int4.task
          curl --location --fail --retry 4 --retry-all-errors --connect-timeout 30 \
            --header "Authorization: Bearer $HF_TOKEN" \
            --output "$MODEL" \
            "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4.task?download=true"
          SIZE=$(stat -c%s "$MODEL")
          if [ "$SIZE" -lt 100000000 ]; then echo "Gemma model download incomplete: $SIZE bytes" >&2; exit 1; fi
          echo "Bundled Gemma model size: $(du -h "$MODEL" | cut -f1)"
      - name: Run JARVIS unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Print debug signing certificate fingerprint
        run: gradle --no-daemon :app:signingReport
      - name: Generate build report and checksum
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          {
            echo "## Pocket Agent Android build"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Trigger: `$GITHUB_EVENT_NAME`"
            echo "- Built at (UTC): `$(date -u +'%Y-%m-%d %H:%M:%S')`"
            echo "- APK size: `$(du -h "$APK" | cut -f1)`"
            echo "- SHA-256:"
            echo '  ```'
            cat app/build/outputs/apk/debug/app-debug.apk.sha256
            echo '  ```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
